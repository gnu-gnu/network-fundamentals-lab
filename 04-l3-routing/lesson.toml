# 학습 팩 레슨 메타데이터. 진단·채점 명령은 고정 argv 이며 모델이 생성하지 않는다.
id = "04"
number = "04"
title = "04장 L3 라우팅"
topology = "04-l3-routing.clab.yml"
assessment = "fault"
concept = "라우팅은 목적지별 다음 홉 선택이다. 요청의 경로와 응답의 리턴 경로가 모두 있어야 통신한다."
goal = "h1 에서 h2(다른 서브넷)로 ping 이 통해야 한다."
fault = "r2 에 10.4.1.0/24(반대편 서브넷)로 가는 경로가 없다. 왕복 중 돌아오는 경로가 끊겨 통신이 실패한다(편도만 되는 전형적 라우팅 누락)."
topics = ["왕복", "리턴", "라우팅"]
hints = [
  "ping 이 아예 안 가나요, 아니면 가는데 응답이 안 오나요? 편도만 되는지 확인해 보세요.",
  "라우터의 양방향을 모두 보세요. 가는 경로가 있으면 돌아오는 경로도 있어야 합니다.",
  "r2 의 라우팅 테이블에 10.4.1.0/24 로 가는 경로가 있는지 확인하세요. 없으면 돌아오는 패킷이 길을 잃습니다.",
]

[[checks]]
node = "h1"
argv = ["ping", "-c1", "-W2", "10.4.2.10"]
expect = { contains = "1 received" }

[[probes]]
label = "h1→h2 ping"
node = "h1"
argv = ["ping", "-c1", "-W1", "10.4.2.10"]

[[probes]]
label = "h1 라우팅"
node = "h1"
argv = ["ip", "route"]

[[probes]]
label = "r1 라우팅"
node = "r1"
argv = ["ip", "route"]

[[probes]]
label = "r2 라우팅"
node = "r2"
argv = ["ip", "route"]

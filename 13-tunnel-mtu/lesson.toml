# 학습 팩 레슨 메타데이터. 진단·채점 명령은 고정 argv 이며 모델이 생성하지 않는다.
id = "13"
number = "13"
title = "13장 오버레이 MTU"
topology = "13-tunnel-mtu.clab.yml"
assessment = "fault"
concept = "터널 헤더가 MTU를 소비한다. 로컬 링크 MTU만으로 경로 중간의 더 작은 MTU를 알 수 없으므로 경로 최솟값에서 오버헤드를 빼야 한다."
goal = "경로 최솟값에서 오버헤드를 뺀 MTU로 큰 오버레이 패킷을 전달한다."
fault = "경로 중간 MTU 1400, vtep1 오버레이 MTU 1450, vtep2가 비초기 조각을 거부한다."
topics = ["VXLAN", "MTU", "PMTUD", "단편"]
hints = [
  "관찰 결과를 근거로 원인을 좁혀 보세요.",
  "양 끝의 설정과 왕복 경로를 비교해 보세요.",
  "정상 조건과 실제 상태의 차이를 확인하세요.",
]

[[checks]]
node = "vtep1"
argv = ["ping", "-M", "dont", "-c1", "-W2", "-s", "1400", "192.168.100.2"]
expect = { contains = "1 received" }

[[probes]]
label = "vtep1 링크"
node = "vtep1"
argv = ["ip", "-d", "link", "show", "vxlan100"]

[[probes]]
label = "vtep2 링크"
node = "vtep2"
argv = ["ip", "-d", "link", "show", "vxlan100"]

[[probes]]
label = "중간 링크"
node = "r1"
argv = ["ip", "-br", "link"]

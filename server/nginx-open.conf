# Unauthenticated shared guest lab. Restrict network exposure at the deployment boundary.
server {
    listen 8088 default_server;
    server_name _;
    absolute_redirect off;

    location = / {
        proxy_pass http://127.0.0.1:9000/whoami;
        proxy_set_header X-Lab-Proxy-Auth "__NETLAB_PROXY_SECRET__";
        proxy_set_header X-Lab-User "guest";
        proxy_set_header X-Lab-Admin "";
        proxy_set_header Host $host;
    }

    # Open lab access does not grant management privileges.
    location /admin { return 403; }
    location / { return 404; }
    include /etc/nginx/netlab.d/lan-users.conf;
}

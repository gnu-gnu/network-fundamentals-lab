# netlab 포털
#
# 리스너를 둘로 나눈다.
#   127.0.0.1:8088  cloudflared 가 붙는 곳. Cloudflare Access 를 통과한 요청만 온다.
#                   → Access 가 서명한 JWT 를 검증해 신원을 얻는다 (로그인 한 번으로 끝)
#   0.0.0.0:8088    그 외(사내망 직결). Access 를 거치지 않으므로 basic auth 로 막는다.
#
# nginx 는 더 구체적인 listen 주소를 우선하므로, 터널 트래픽은 127.0.0.1 블록으로 간다.
# 이메일 헤더만 믿고 인증하면 사내망에서 헤더를 위조해 관리자가 될 수 있다.
# 그래서 반드시 JWT 서명을 검증한다.

# ── 터널 (Cloudflare Access) ──────────────────────────────────────────
server {
    listen 127.0.0.1:8088;
    server_name _;
    # 상대경로 리디렉트에 nginx 가 자기 listen 포트(8088)를 붙이는 걸 막는다.
    # cloudflared 가 127.0.0.1:8088 로 붙어서, 안 그러면 브라우저가
    # http://netlab.gnu.or.kr:8088 로 튕겨 Cloudflare 를 우회한다.
    absolute_redirect off;

    # 권한 판정은 labd 한 곳에서만 한다. nginx 는 200/401/403 만 본다.
    location = /_access {
        internal;
        proxy_pass http://127.0.0.1:9000/_access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # target is fixed by each generated user location, not supplied by clients.
        proxy_set_header X-Lab-Target-User $arg_target;
        proxy_set_header X-Lab-Auth-Scheme target;
    }
    location = /_access_admin {
        internal;
        proxy_pass http://127.0.0.1:9000/_access_admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Lab-Target-User "";
        proxy_set_header X-Lab-Auth-Scheme target;
    }

    location = / {
        auth_request /_access;
        auth_request_set $lab_user $upstream_http_x_lab_user;
        proxy_pass http://127.0.0.1:9000/whoami;
        proxy_set_header X-Lab-Proxy-Auth "__NETLAB_PROXY_SECRET__";
        proxy_set_header X-Lab-User $lab_user;
        proxy_set_header Host       $host;
    }

    location /admin/ {
        auth_request /_access_admin;
        auth_request_set $lab_admin $upstream_http_x_lab_user;
        proxy_pass http://127.0.0.1:9000/admin/;
        proxy_set_header X-Lab-Proxy-Auth "__NETLAB_PROXY_SECRET__";
        proxy_set_header X-Lab-Admin $lab_admin;
        proxy_set_header Host        $host;
        proxy_read_timeout 300s;
    }

    include /etc/nginx/netlab.d/tunnel-users.conf;
}

# ── 사내망 직결 (basic auth) ──────────────────────────────────────────
server {
    listen 8088 default_server;
    server_name _;
    # 상대경로 리디렉트에 nginx 가 자기 listen 포트(8088)를 붙이는 걸 막는다.
    # cloudflared 가 127.0.0.1:8088 로 붙어서, 안 그러면 브라우저가
    # http://netlab.gnu.or.kr:8088 로 튕겨 Cloudflare 를 우회한다.
    absolute_redirect off;

    location = / {
        auth_basic           "네트워크 실습 환경";
        auth_basic_user_file /etc/netlab/htpasswd.all;
        # return 은 인증보다 먼저 실행되므로 쓰지 않는다. 리다이렉트는 labd 가 만든다.
        proxy_pass http://127.0.0.1:9000/whoami;
        proxy_set_header X-Lab-Proxy-Auth "__NETLAB_PROXY_SECRET__";
        proxy_set_header X-Lab-User $remote_user;
        proxy_set_header Host       $host;
    }

    location /admin/ {
        auth_basic           "관리자 콘솔";
        auth_basic_user_file /etc/netlab/admin.htpasswd;
        proxy_pass http://127.0.0.1:9000/admin/;
        proxy_set_header X-Lab-Proxy-Auth "__NETLAB_PROXY_SECRET__";
        proxy_set_header X-Lab-Admin $remote_user;
        proxy_set_header Host        $host;
        proxy_read_timeout 300s;
    }

    include /etc/nginx/netlab.d/lan-users.conf;
}
